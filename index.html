:root{--ink:#173d39;--forest:#0d5149;--teal:#007368;--gold:#f4c35d;--paper:#f8f3e9;--line:#d7d5c6;--muted:#52685e;--pink:#a74739;--shadow:0 5px 0 #ded8c9}
*{box-sizing:border-box}body{margin:0;background-color:var(--paper);background-image:radial-gradient(#b79e6f24 .9px,transparent 1px);background-size:13px 13px;color:var(--ink);font:clamp(16px,1.35vw,21px)/1.75 ClassNoto,Tahoma,Arial,sans-serif}
h1,h2,h3,p,figure{margin:0}h1,h2,h3,.identity strong,.primary,.heroEq{font-family:ClassKufi,Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button,a,input,textarea,select{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid #bc6517;outline-offset:3px}button:disabled{cursor:default;opacity:.48}
button{background:#fffdf6;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:.37em 1em;font-weight:bold}button:hover:not(:disabled){border-color:#1e7467;background:#edf7ed}button:active:not(:disabled){transform:translateY(1px)}
.shell{max-width:1240px;margin:auto;padding:0 clamp(16px,4vw,60px)}.mast,.identity,.tools,.navigation,.inline,.dhead,.topline,.timerBar,.toolLabel{display:flex;align-items:center}.mast{justify-content:space-between;gap:12px;padding:19px 0 14px}.identity{gap:12px}.identity img{width:55px;height:55px;object-fit:contain}.identity strong,.identity small{display:block}.identity strong{font-size:22px;line-height:1.6}.identity small{color:var(--muted);font-size:13px}.tools{gap:6px}.tools button{font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px}.icon{width:19px;height:19px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.progressTrack{height:4px;background:#e2ddcf;border-radius:5px}.progressTrack i{display:block;height:100%;background:#257b6d;border-radius:inherit;transition:width .3s}main{margin:20px 0 0;outline:0}.screen{position:relative;border:1px solid var(--line);border-radius:25px;background:#fffdf7;padding:clamp(20px,3.2vw,45px);box-shadow:var(--shadow);overflow:hidden;min-height:clamp(430px,57vh,650px)}
.kicker{font-size:14px;color:#517061;font-weight:700;letter-spacing:.02em;margin-bottom:6px}.screen h2,.dhead h2{font-size:clamp(26px,3.2vw,43px);line-height:1.65}.screen h3{font-size:clamp(18px,1.75vw,25px);line-height:1.7}.screen .lead{color:#426359;margin:4px 0 16px}.topline{justify-content:space-between;align-items:flex-start;gap:12px}.topline>div:first-child{min-width:0;flex:1}.timerBar{border:1px solid var(--line);border-radius:12px;padding:2px 5px;gap:4px;white-space:nowrap;background:#fffdf6;font-size:13px;flex-wrap:wrap;justify-content:center}.timerBar button{min-height:36px;border:0;padding:2px 5px;font-size:13px}.timerBar output{font:700 16px ClassNoto,Tahoma;color:var(--forest);min-width:36px;text-align:center}.timerBar.timedOut{border-color:#bc721b}
.hero{display:grid;grid-template-columns:1.12fr 1fr;background:#fffaf0;padding:0}.intro{align-self:center;padding:clamp(24px,3.5vw,52px)}.intro h1{font-size:clamp(40px,5vw,77px);line-height:1.6;letter-spacing:-.045em}.intro h1 b{color:#a35c1c}.intro h2{font:700 clamp(20px,2.25vw,31px)/1.75 ClassKufi,Tahoma;margin-top:16px}.intro .kicker{color:#805016}.intro .small{margin:0 0 8px;color:#53695f}.heroVisual{direction:ltr;position:relative;isolation:isolate;overflow:hidden;border-radius:22px;margin:16px 0 16px 16px;min-height:375px;background:radial-gradient(ellipse at 40% 18%,#24685d,#124940 62%,#0e3735);display:flex;align-items:flex-start;justify-content:center}.heroVisual:before{content:"";position:absolute;inset:13px;border:1px solid #bbddbb66;border-radius:15px;z-index:-1;background-image:radial-gradient(#e2f2d924 1px,transparent 1px);background-size:15px 15px}.abacus{width:80%;height:auto;max-height:260px;margin:28px 0 160px}.heroVisual .kids{position:absolute;bottom:0;left:8%;width:clamp(125px,42%,205px);max-height:54%;object-fit:contain;object-position:bottom}.heroEq{position:absolute;color:#f8df98;bottom:10%;right:8%;font-size:clamp(18px,2.5vw,38px);transform:rotate(-5deg)}.hero .feedback:empty{display:none}

function exitCard(){return `<section class="screen">${heading("تقويم ختامي فردي","بطاقة خروج",true)}<div class="work"><h3>رُزَم البطاقات</h3>${task("exit",custom.exit)}</div></section>`;}
const moods=[["😊","واثقة","أستطيع تمثيل حقيقة ضرب في ١٠ وشرحها لزميلتي."],["🤔","أحتاج إلى تدريب","سأعود إلى المعمل وأمثّل أربع عشرات، ثم أكتب جملة الضرب."],["🙋‍♀️","لديّ سؤال","سأخبر معلّمتي بالخطوة التي أحتاج فيها إلى مساعدة."]];
function feelings(){return `<section class="screen">${heading("ختام الحصة","كيف تشعرين بعد درس اليوم؟")}<p class="lead">اختاري العبارة الأقرب إلى شعوركِ.</p><div class="choices moods">${moods.map(([e,label],i)=>`<button data-mood="${i}" aria-pressed="${mood===String(i)}" class="${mood===String(i)?"picked":""}"><b aria-hidden="true">${e}</b>${label}</button>`).join("")}</div><div id="moodReply" class="feedback ${mood!==""?"model":""}" role="status">${mood!==""?moods[Number(mood)][2]:""}</div><div class="actions"><button data-go="4">العودة إلى معمل العشرات</button></div></section>`;}



let sourceText="";
function queryFor(key){return custom[key] || Q[Number(key)];}
function stopClock(){if(interval!==null) clearInterval(interval);interval=null;}
function displayTime(){
 const o=el("time");if(!o)return;
 o.textContent=ar(Math.floor(remaining/60)+":"+String(remaining%60).padStart(2,"0"));
 el("timeToggle").textContent=interval!==null?"إيقاف مؤقت":remaining===0?"تشغيل جديد":remaining===(limits[current]||60)?"ابدئي المؤقّت":"استئناف";
 o.parentElement.classList.toggle("timedOut",remaining===0);
}
function resetTime(){stopClock();remaining=limits[current]||60;displayTime();}
function toggleClock(){
 if(interval!==null){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));stopClock();displayTime();return;}
 if(remaining===0) remaining=limits[current]||60;
 deadline=Date.now()+remaining*1000;
 interval=setInterval(()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(remaining===0){stopClock();el("announce").textContent="انتهى وقت النشاط.";}displayTime();},200);
 displayTime();
}
function setSound(){
 el("sound").innerHTML=icon(soundOn?"sound":"mute")+(soundOn?"الصوت":"مكتوم");el("sound").setAttribute("aria-pressed",soundOn);el("sound").title=soundOn?"كتم صوت التصفيق":"تشغيل صوت التصفيق";if(!soundOn){el("claps").pause();el("claps").currentTime=0;}
}
function celebrate(key){
 if(awards.has(key))return;awards.add(key);
 if(soundOn){const clip=el("claps");clip.currentTime=0;clip.volume=.82;const play=clip.play();if(play) play.catch(()=>{});}
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 for(let j=0;j<18;j++){const star=document.createElement("span");star.className="spark";star.textContent=j%2?"✦":"★";star.style.left=(26+Math.random()*49)+"%";star.style.top=(32+Math.random()*32)+"%";star.style.setProperty("--dx",(Math.random()-.5)*295+"px");star.style.setProperty("--dy",(-37-Math.random()*125)+"px");el("stars").appendChild(star);setTimeout(()=>star.remove(),1400);}
}
function mark(key,ok){
 const q=queryFor(key),st=stateFor(key);
 if(st.done)return;
 st.done=ok;st.tone=ok?"good":"hint";st.msg=ok?"★ أحسنتِ! "+q.explain:q.hint;
 if(ok)celebrate(key);
 render();
}
function showMessage(key,msg){
 const st=stateFor(key);st.tone="hint";st.msg=msg;
 const target=$(`[data-feedback="${key}"]`);if(target){target.className="feedback hint";target.textContent=msg;}
}
function go(n){
 if(n<0||n>=chapters.length)return;
 current=n;resetTime();render();window.scrollTo(0,0);el("main").focus({preventScroll:true});
}
function render(){
 const focused=document.activeElement, remembered=focused&&el("main").contains(focused)?(focused.id?{id:focused.id}:{attr:["data-group","data-mood","data-q","data-bubble","data-model"].find(a=>focused.hasAttribute(a)),value:null}):null;
 if(remembered&&remembered.attr)remembered.value=focused.getAttribute(remembered.attr);
 const screen=[warm,nafes,goals,beach,lab,book,book,book,book,book,book,golden,summary,exitCard,feelings][current];
 el("main").innerHTML=screen();
 el("prev").disabled=current===0;el("next").innerHTML=(current===14?"بداية الدرس":"التالي")+icon("next");
 el("position").textContent=ar(current+1)+" من "+ar(chapters.length)+"  ·  ★ "+ar(awards.size);
 el("position").setAttribute("aria-label",`المحطة ${ar(current+1)} من ${ar(chapters.length)}، النجوم ${ar(awards.size)}`);
 el("progress").style.width=((current+1)/chapters.length*100)+"%";displayTime();
 if(remembered){const target=remembered.id?el(remembered.id):remembered.attr?$(`[${remembered.attr}="${remembered.value}"]`):null;if(target&&!target.disabled)target.focus({preventScroll:true});}
}
function handleMain(e){
 const b=e.target.closest("button");if(!b||b.disabled)return;
 if(b.id==="timeToggle"){toggleClock();return;}if(b.id==="timeReset"){resetTime();return;}
 if(b.hasAttribute("data-go")){go(Number(b.dataset.go));return;}
 if(b.hasAttribute("data-group")){groups=Math.max(0,Math.min(10,groups+Number(b.dataset.group)));render();return;}
 if(b.hasAttribute("data-q")){activeQuestion.set(current,Number(b.dataset.q));resetTime();render();return;}
 if(b.hasAttribute("data-pick")){const key=b.dataset.pick,i=Number(b.dataset.value);stateFor(key).choice=i;mark(key,i===queryFor(key).right);return;}
 if(b.hasAttribute("data-bubble")){const st=stateFor("nafes");st.choice=Number(b.dataset.bubble);st.msg="";st.tone="";render();return;}
 if(b.id==="shadeCheck"){const st=stateFor("nafes");if(st.choice===null)showMessage("nafes","اختاري دائرة الإجابة أولًا.");else mark("nafes",st.choice===custom.nafes.right);return;}
 if(b.hasAttribute("data-model")){const key=b.dataset.model,st=stateFor(key);st.tone="model";st.msg="<b>نموذج للمقارنة</b> · "+queryFor(key).explain;render();return;}
 if(b.hasAttribute("data-mood")){mood=b.dataset.mood;render();return;}
}
function onSubmit(e){
 const f=e.target.closest("form[data-check]");if(!f)return;e.preventDefault();
 const k=f.dataset.check,q=queryFor(k),st=stateFor(k);if(st.done)return;
 const fields=q.fields||[["",q.answer]],inputs=[...f.querySelectorAll("input")];
 st.values=inputs.map(i=>i.value);
 const normalized=st.values.map(latin);
 if(normalized.some(v=>!/^\d+$/.test(v))){showMessage(k,"اكتبي عددًا في كل خانة، ثم تحقّقي.");return;}
 mark(k,normalized.every((v,i)=>Number(v)===fields[i][1]));
}
function openDialog(title,body){
 el("dtitle").textContent=title;el("dbody").innerHTML=body;
 if(!el("popup").open)el("popup").showModal();
}
function mapDialog(){
 openDialog("خريطة الدرس",`<div class="mapGrid">${chapters.map((title,i)=>`<button data-route="${i}" aria-current="${i===current}"><b>${ar(i+1)}</b> ${title}</button>`).join("")}</div><p class="subtle">المرجع: كتاب الرياضيات للصف الثالث الابتدائي، الجزء الأول، طبعة ١٤٤٨هـ، الدرس ٤–٦، ص ١٢٨–١٣٠. صيغت الأنشطة التفاعلية وفق مسائل هذه الصفحات.</p><div class="actions"><button id="newClass">بدء حصة جديدة</button></div>`);
}
function codeDialog(){
 openDialog("كود الدرس",`<p>انسخي الكود كاملًا أو نزّليه باسم <bdi dir="ltr">index.html</bdi>. الصور والخط والتصفيق مضمّنة في الملف.</p><div class="actions"><button id="copy" class="primary">نسخ الكود كاملًا</button><button id="download">تنزيل index.html</button></div><p id="codeState" role="status"></p><textarea dir="ltr" wrap="off" id="source" readonly spellcheck="false" aria-label="الكود الكامل"></textarea>`);
 el("source").value=sourceText;
}
async function copySource(){
 try{await navigator.clipboard.writeText(sourceText);el("codeState").textContent="تم نسخ كود الدرس كاملًا.";}
 catch{const area=el("source");area.focus();area.select();let ok=false;try{ok=document.execCommand("copy");}catch{}el("codeState").textContent=ok?"تم نسخ كود الدرس كاملًا.":"الكود محدّد بالكامل. اضغطي Ctrl+C أو اختاري «نسخ».";}
}
function downloadSource(){
 const url=URL.createObjectURL(new Blob([sourceText],{type:"text/html;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="index.html";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
document.addEventListener("DOMContentLoaded",()=>{
 sourceText="<!doctype html>\n"+document.documentElement.outerHTML;
 el("prev").innerHTML=icon("back")+"السابق";el("mapOpen").innerHTML=icon("map")+"الخريطة";el("codeOpen").innerHTML=icon("code")+"الكود";
 el("mapOpen").onclick=mapDialog;el("codeOpen").onclick=codeDialog;el("close").onclick=()=>el("popup").close();el("sound").onclick=()=>{soundOn=!soundOn;setSound();};setSound();
 el("prev").onclick=()=>go(current-1);el("next").onclick=()=>go((current+1)%chapters.length);
 el("main").addEventListener("click",handleMain);el("main").addEventListener("submit",onSubmit);
 el("main").addEventListener("input",e=>{const t=e.target;if(t.dataset.key)stateFor(t.dataset.key).values[Number(t.dataset.idx)]=t.value;if(t.dataset.note)stateFor(t.dataset.note).note=t.value;});
 el("dbody").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-route")){el("popup").close();go(Number(b.dataset.route));}
  else if(b.id==="copy")copySource();else if(b.id==="download")downloadSource();
  else if(b.id==="newClass"){openDialog("بدء حصة جديدة","<p>هل ترغبين في تصفير النجوم والإجابات والمؤقّت؟</p><div class='actions'><button id='resetYes' class='primary'>ابدئي حصة جديدة</button><button id='resetNo'>عودة للخريطة</button></div>");}
  else if(b.id==="resetNo")mapDialog();else if(b.id==="resetYes"){answers.clear();awards.clear();activeQuestion.clear();groups=3;mood="";el("claps").pause();el("popup").close();go(0);}
 });
 document.addEventListener("keydown",e=>{if(el("popup").open||e.altKey||e.ctrlKey||e.metaKey||e.target.closest("input,textarea,select,button,summary"))return;if(e.key==="ArrowLeft"&&current<chapters.length-1){e.preventDefault();go(current+1);}else if(e.key==="ArrowRight"&&current>0){e.preventDefault();go(current-1);}});
 resetTime();render();if(location.hash==="#code")codeDialog();
});


</script>
